name: release-delta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to packages/opencode/package.json)"
        required: false
        type: string
  push:
    tags:
      - "delta-v*"

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'Cruz1122/opencode-delta'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#delta-v}"
            if [ "$version" = "$GITHUB_REF_NAME" ]; then
              version=$(node -e 'process.stdout.write(require("./packages/opencode/package.json").version)')
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build all release targets
        run: bun run packages/opencode/script/build.ts
      - name: Package Delta artifacts
        run: bun run script/package-delta-release.ts
        env:
          OPENCODE_DELTA_VERSION: ${{ steps.meta.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-delta-release
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: github.repository == 'Cruz1122/opencode-delta'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opencode-delta-release
          path: release
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version=$(node -e 'process.stdout.write(require("./release/release.json").version)')
          echo "version=${version#delta-v}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "delta-v${{ steps.release.outputs.version }}" release/* \
            --repo "${{ github.repository }}" \
            --title "OpenCode Delta ${{ steps.release.outputs.version }}" \
            --generate-notes
